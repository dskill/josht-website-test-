- name: events
  label: Calendar / events
  type: file
  path: cms/events.json
  format: json
  description: Manage the visible upcoming list. Move completed items into Additional past events; the original
    archive below is retained unchanged. This is not an ICS calendar service.
  fields:
  - name: upcoming_heading
    label: Upcoming heading
    type: string
    required: true
  - name: upcoming
    label: Upcoming events
    type: object
    list:
      max: 200
      collapsible:
        collapsed: true
        summary: '{title} — {when}'
    fields: &id001
    - name: title
      label: Event or venue
      type: string
      required: true
    - name: subtitle
      label: Talk or panel title
      type: string
    - name: when
      label: Date and time as displayed
      type: string
      required: true
      description: Include the confirmed year and timezone for new events. Existing ambiguous source dates are preserved.
    - name: details
      label: Additional details
      type: text
    - name: url
      label: Event information URL
      type: string
    - name: link_label
      label: Link text
      type: string
    - name: image
      label: Optional event image
      type: image
      options:
        media: images
        path: dist/assets/uploads
    - name: image_alt
      label: Image description
      type: string
  - name: additional_past
    label: Additional past events
    type: object
    list:
      max: 200
      collapsible:
        collapsed: true
        summary: '{title} — {when}'
    fields: *id001

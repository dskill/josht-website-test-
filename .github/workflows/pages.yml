name: Publish static website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate JavaScript
        run: node --check dist/app.js && node --check dist/editor.js
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare project paths without replacing content edits
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python prepare_pages.py --base-path "$BASE_PATH"
      - name: Validate static output
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python validate_site.py --directory _site --base-path "$BASE_PATH"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

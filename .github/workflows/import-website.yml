name: Import faithful website and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  import-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Import pinned source with current feature notes
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          from zipfile import ZipFile
          from io import BytesIO
          import json,gzip,base64,hashlib
          url="https://josh-tuininga-art-comics-preview.indigofox13.chatgpt.site/source.zip"
          with urlopen(url,timeout=120) as response: archive=response.read()
          assert hashlib.sha256(archive).hexdigest()=="c19f6a182e4c23333ce40d429fb733977756853342ef053a308d1d3536030d42", "Source archive checksum mismatch"
          for item in ZipFile(BytesIO(archive)).infolist():
              path=Path(item.filename)
              if item.is_dir(): continue
              assert not path.is_absolute() and ".." not in path.parts and path.parts[0] not in [".git",".openai",".github"]
              if path.name in ["source.zip","responsive-check.html","fetch_assets.py"]: continue
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(ZipFile(BytesIO(archive)).read(item))
          updates=json.loads(gzip.decompress(base64.b64decode("")))
          for name,contents in updates.items():
              path=Path(name); assert not path.is_absolute() and ".." not in path.parts
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(contents)
          print("Verified source archive and applied current static-service replacements.")
      - name: Import verified artwork, styles and fonts
        run: python scripts/import_assets.py
      - name: Rebuild the initial source snapshot with unsupported features removed
        run: |
          python -m pip install lxml
          python build.py --refresh-original-content
      - name: Commit complete source and original assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .gitignore build.py prepare_pages.py validate_site.py dist source-original reference scripts examples
          if ! git diff --cached --quiet; then
            git commit -m "Import faithful website with unsupported-service notes and original assets"
            git push origin HEAD:main
          fi
      - name: Validate JavaScript
        run: node --check dist/app.js && node --check dist/editor.js
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare and validate project paths
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python prepare_pages.py --base-path "$BASE_PATH"
          python validate_site.py --directory _site --base-path "$BASE_PATH"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: import-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

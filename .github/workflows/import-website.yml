name: Import faithful website and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  import-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Extract verified repository-contained source
        shell: python
        run: |
          from pathlib import Path
          import gzip,base64,json,hashlib
          payload="".join(p.read_text() for p in sorted(Path(".bootstrap").glob("josh-source-part-*.txt")))
          assert hashlib.sha256(payload.encode()).hexdigest()=="ab10979a4e2688417be5daefa2ce8fb52c8d139c7335d347638f1326307ead45", "Source integrity mismatch"
          files=json.loads(gzip.decompress(base64.b64decode(payload)))
          for name,contents in files.items():
              path=Path(name)
              assert not path.is_absolute() and ".." not in path.parts and path.parts[0] not in [".git",".openai",".github"]
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(contents)
          print("Extracted",len(files),"verified source files with unsupported-service notes.")
      - name: Import verified artwork, styles and fonts
        run: python scripts/import_assets.py
      - name: Commit complete source and original assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .gitignore build.py prepare_pages.py validate_site.py dist source-original reference scripts examples
          if ! git diff --cached --quiet; then
            git commit -m "Import faithful website with unsupported-service notes and original assets"
            git push origin HEAD:main
          fi
      - name: Validate JavaScript
        run: node --check dist/app.js && node --check dist/editor.js
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare and validate project paths
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python prepare_pages.py --base-path "$BASE_PATH"
          python validate_site.py --directory _site --base-path "$BASE_PATH"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: import-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
